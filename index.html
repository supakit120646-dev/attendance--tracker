<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance : Cloud DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-card">
        <div id="page-login" class="page active">
            <h2>ลงชื่อเข้าใช้</h2>
            <p class="subtitle">ระบบลงเวลา Adtendance Tracker</p>
            <div class="input-group">
                <label>รหัสพนักงาน</label>
                <input type="text" id="loginUsername" placeholder="กรอกรหัสพนักงาน">
            </div>
            <div class="input-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="loginPassword" placeholder="••••••">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">เข้าสู่ระบบ</button>
            <button class="btn btn-outline" onclick="goToPage('page-register-data')">ลงทะเบียนพนักงานใหม่</button>
        </div>

        <div id="page-register-data" class="page">
            <h2>ลงทะเบียนใหม่</h2>
            <p class="subtitle">กรอกข้อมูลส่วนตัว</p>
            <div class="input-group">
                <label>ชื่อจริง</label>
                <input type="text" id="regFirstName" placeholder="กรอกชื่อ">
            </div>
            <div class="input-group">
                <label>นามสกุล</label>
                <input type="text" id="regLastName" placeholder="กรอกนามสกุล">
            </div>
            <div class="input-group">
                <label>รหัสพนักงาน</label>
                <input type="text" id="regUsername" placeholder="กรอกรหัสพนักงาน">
            </div>
            <div class="input-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="regPassword" placeholder="กรอกรหัสผ่าน">
            </div>
            <button class="btn btn-primary" onclick="validateAndGoToScan()">บันทึกใบหน้า</button>
            <button class="btn btn-outline" onclick="goToPage('page-login')">ย้อนกลับ</button>
        </div>

        <div id="page-register-scan" class="page">
            <h2>บันทึกใบหน้า</h2>
            <p class="subtitle">ระบบจะเก็บภาพหลายมุม</p>
            <div id="video-wrapper">
                <video id="video-scan" autoplay muted playsinline></video>
                <div id="scan-ui" class="scan-overlay hidden">
                    <div class="scanner-ring"></div>
                    <div class="scan-text" id="scan-percent">0%</div>
                </div>
            </div>
            <p id="ai-loading-status" style="color:var(--text-sub); font-size:14px; margin-bottom:10px;">⏳ กำลังโหลดระบบ AI...</p>
            <button id="btn-start-reg-scan" class="btn btn-primary" onclick="startFaceScanProcess()" disabled>รอระบบพร้อม...</button>
            <button class="btn btn-outline" onclick="stopScanAndBack()">ยกเลิก</button>
        </div>

        <div id="page-dashboard" class="page">
            <h2 id="welcome-msg" style="color:var(--primary);">สวัสดี</h2>
            <p class="subtitle" id="current-time">00:00:00</p>
            <p style="color:var(--text-sub); font-size:14px; margin-bottom:15px;">เลือกรายการที่ต้องการบันทึก:</p>
            <div class="grid-menu">
                <button class="btn-menu" onclick="openScanner('เข้างาน (เช้า)')"><span>☀️</span> เข้าเช้า</button>
                <button class="btn-menu" onclick="openScanner('พักเที่ยง')"><span>🍛</span> พักเที่ยง</button>
                <button class="btn-menu" onclick="openScanner('เข้างาน (บ่าย)')"><span>🕑</span> เข้าบ่าย</button>
                <button class="btn-menu" onclick="openScanner('เลิกงาน')"><span>🏠</span> เลิกงาน</button>
            </div>
            <button class="btn btn-primary" onclick="openHistory()">📋 ดูประวัติการเข้างาน</button>
            <button class="btn btn-outline" style="border-color:var(--error); color:var(--error);" onclick="handleLogout()">ออกจากระบบ</button>
        </div>
    </div>

    <div id="modal-scanner" class="modal">
        <div class="modal-content">
            <h2 id="scan-title">ยืนยันตัวตน</h2>
            <p class="subtitle">กดเปิดกล้องเพื่อยืนยัน</p>
            <div style="position: relative; width: 100%; height: 300px; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 20px;">
                <div id="camera-placeholder" style="width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#f1f5f9; color: var(--text-sub);">
                    <div style="font-size:40px; margin-bottom:10px;">📷</div>
                    <button class="btn btn-primary" style="width:auto; padding:10px 25px;" onclick="startAuthCamera()">เปิดกล้อง</button>
                </div>
                <video id="video-auth" class="hidden" style="width:100%; height:100%; object-fit:cover;" autoplay muted playsinline></video>
            </div>
            <button id="btn-scan-confirm" class="btn btn-primary hidden" onclick="performCheckIn()">📸 สแกนใบหน้ายืนยัน</button>
            <button class="btn btn-outline" onclick="closeScanner()">ยกเลิก</button>
        </div>
    </div>
    
    <div id="modal-history" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <h2>ประวัติการเข้างาน</h2>
            <div class="history-container">
                <table>
                    <thead><tr><th>เวลา</th><th>รายการ</th><th>สถานะ</th></tr></thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
            <button class="btn btn-outline" onclick="document.getElementById('modal-history').classList.remove('active')">ปิดหน้าต่าง</button>
        </div>
    </div>

    <div id="custom-popup" class="popup-container">
        <div class="popup-content-box">
            <span id="popup-icon" class="popup-icon"></span>
            <h3 id="popup-title">Title</h3>
            <p id="popup-message" style="color:var(--text-sub); margin-top:10px;">Message</p>
            <button class="btn btn-primary" style="margin-top:20px;" onclick="closePopup()">ตกลง</button>
        </div>
    </div>

</body>
</html>
